services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      HYDROFED_DB_PATH: /data/experiments.db
      HYDROFED_ALLOWED_ORIGINS: ${HYDROFED_ALLOWED_ORIGINS:-http://localhost:8080}
      HYDROFED_SECRET_KEY: ${HYDROFED_SECRET_KEY:?set HYDROFED_SECRET_KEY}
      HYDROFED_FRONTEND_URL: ${HYDROFED_FRONTEND_URL:-http://localhost:8080}
      HYDROFED_PUBLIC_API_URL: ${HYDROFED_PUBLIC_API_URL:-http://localhost:8080}
      HYDROFED_GOOGLE_CLIENT_ID: ${HYDROFED_GOOGLE_CLIENT_ID:-}
      HYDROFED_GOOGLE_CLIENT_SECRET: ${HYDROFED_GOOGLE_CLIENT_SECRET:-}
      HYDROFED_MICROSOFT_CLIENT_ID: ${HYDROFED_MICROSOFT_CLIENT_ID:-}
      HYDROFED_MICROSOFT_CLIENT_SECRET: ${HYDROFED_MICROSOFT_CLIENT_SECRET:-}
      HYDROFED_ADMIN_EMAIL: ${HYDROFED_ADMIN_EMAIL:-}
      HYDROFED_ADMIN_NAME: ${HYDROFED_ADMIN_NAME:-}
      HYDROFED_ADMIN_PASSWORD: ${HYDROFED_ADMIN_PASSWORD:-}
    volumes:
      - hydrofed-data:/data
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "${HYDROFED_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hydrofed-data:
